<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>매장관리 AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f4f6f5;color:#18221d}header{position:sticky;top:0;background:#123d2c;color:white;padding:16px;z-index:5}nav{display:flex;gap:8px;overflow:auto;padding:10px;background:white;border-bottom:1px solid #ddd}nav button,.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.btn{background:#13885a;color:white}.ghost{background:#e9f1ed;color:#254238}.danger{background:#fee9e9;color:#a63838}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:white;border:1px solid #e1e8e4;border-radius:16px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat b{font-size:22px}.muted{color:#738179;font-size:12px}.hide{display:none}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input,.field select,.field textarea{padding:10px;border:1px solid #d8e1dc;border-radius:9px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:650px}.calwrap{overflow:auto}.day{min-height:105px;border:1px solid #e1e8e4;border-radius:10px;padding:6px;background:#fff}.holiday{background:#fff5f3}.chip{display:block;width:100%;margin-top:4px;border:0;border-radius:6px;padding:4px;background:#e8f6ef;font-size:10px;text-align:left}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}.box{background:white;border-radius:16px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto}table{width:100%;border-collapse:collapse}th,td{font-size:12px;padding:8px;border-bottom:1px solid #edf0ee;text-align:left}.login{position:fixed;inset:0;background:#0e251b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.login .box{max-width:420px}.login button{width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.calendar{min-width:580px}}</style></head><body><div id="login" class="login"><div class="box"><h1>매장관리 AI</h1><p class="muted">대한민국 음식점용</p><div class="field"><label>PIN</label><input id="pin" value="1234" inputmode="numeric"></div><button class="btn" onclick="login()">로그인</button><p class="muted">초기 PIN 1234</p></div></div><header><b>매장관리 AI</b><div class="muted" style="color:#cde0d6">직원·급여·위생·달력 통합관리</div></header><nav><button onclick="show('home')">홈</button><button onclick="show('cal')">달력</button><button onclick="show('hyg')">위생일지</button><button onclick="show('emp')">직원</button><button onclick="show('pay')">급여</button><button onclick="show('set')">설정</button></nav><main class="wrap"><section id="home"></section><section id="cal" class="hide"></section><section id="hyg" class="hide"></section><section id="emp" class="hide"></section><section id="pay" class="hide"></section><section id="set" class="hide"></section></main><div id="modal"></div><script>const K='kitchen_ai_live_v4';let db=JSON.parse(localStorage.getItem(K)||'null')||{pin:'1234',employees:[{id:1,name:'김직원',type:'hourly',rate:10320,insurance:true,tax:0}],work:[],hyg:[]};let ym=new Date();const holidays={'2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴','2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-06':'현충일','2026-07-17':'제헌절','2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-09-28':'대체공휴일','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절'};function save(){localStorage.setItem(K,JSON.stringify(db));render()}function won(n){return '₩'+Math.round(n||0).toLocaleString('ko-KR')}function login(){if(document.getElementById('pin').value===db.pin)document.getElementById('login').classList.add('hide');else alert('PIN을 확인해주세요.')}function show(id){['home','cal','hyg','emp','pay','set'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));render()}function render(){renderHome();renderCal();renderHyg();renderEmp();renderPay();renderSet()}function monthKey(){return ym.getFullYear()+'-'+String(ym.getMonth()+1).padStart(2,'0')}function monthWork(){return db.work.filter(w=>w.date.startsWith(monthKey()))}function grossFor(e){let t=0;monthWork().filter(w=>w.empId==e.id).forEach(w=>{if(e.type==='daily')t+=Number(w.daily||e.rate||0);else if(e.type==='monthly')t+=0;else t+=(Number(w.hours||0)*e.rate);t+=Number(w.extra||0);if(w.holiday)t+=Number(w.holidayExtra||0)});if(e.type==='monthly')t+=Number(e.rate||0);return t}function deductions(e,g){if(!e.insurance)return{p:0,h:0,l:0,u:0,t:Number(e.tax||0),local:Math.round(Number(e.tax||0)*.1)};let p=g*.0475,h=g*.03595,l=h*.1295,u=g*.009,t=Number(e.tax||0);return{p,h,l,u,t,local:Math.round(t*.1)}}function renderHome(){let gross=db.employees.reduce((s,e)=>s+grossFor(e),0);document.getElementById('home').innerHTML='<div class="card"><h2>이번 달 현황</h2><div class="grid"><div class="stat"><span class="muted">직원</span><b>'+db.employees.length+'명</b></div><div class="stat"><span class="muted">근무기록</span><b>'+monthWork().length+'건</b></div><div class="stat"><span class="muted">위생일지</span><b>'+db.hyg.filter(x=>x.date.startsWith(monthKey())).length+'건</b></div><div class="stat"><span class="muted">예상 세전급여</span><b>'+won(gross)+'</b></div></div></div><div class="card"><h3>빠른 입력</h3><button class="btn" onclick="openWork(new Date().toISOString().slice(0,10))">오늘 근무 추가</button> <button class="ghost" onclick="openHyg(new Date().toISOString().slice(0,10))">오늘 위생일지</button></div>'}function renderCal(){let y=ym.getFullYear(),m=ym.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),html='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button onclick="ym.setMonth(ym.getMonth()-1);render()">◀</button><b>'+y+'년 '+(m+1)+'월</b><button onclick="ym.setMonth(ym.getMonth()+1);render()">▶</button></div><div class="calwrap"><div class="calendar" style="margin-top:10px">';['일','월','화','수','목','금','토'].forEach(d=>html+='<b style="text-align:center">'+d+'</b>');for(let i=0;i<first;i++)html+='<div></div>';for(let d=1;d<=last;d++){let date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),hw=db.hyg.filter(x=>x.date===date).length,ww=db.work.filter(x=>x.date===date).length;html+='<div class="day '+(holidays[date]?'holiday':'')+'"><b>'+d+'</b><small class="muted"> '+(holidays[date]||'')+'</small><button class="chip" onclick="openWork(\''+date+'\')">근무 '+ww+'건</button><button class="chip" onclick="openHyg(\''+date+'\')">위생 '+hw+'건</button></div>'}html+='</div></div></div>';document.getElementById('cal').innerHTML=html}function openWork(date){let opts=db.employees.map(e=>'<option value="'+e.id+'">'+e.name+'</option>').join('');document.getElementById('modal').innerHTML='<div class="modal"><div class="box"><h3>'+date+' 근무 추가</h3><div class="field"><label>직원</label><select id="we">'+opts+'</select></div><div class="grid"><div class="field"><label>근무시간</label><input id="wh" type="number" step="0.5" value="8"></div><div class="field"><label>일당(필요시)</label><input id="wd" type="number" value="0"></div><div class="field"><label>기타/연장수당</label><input id="wx" type="number" value="0"></div><div class="field"><label>공휴일 추가수당</label><input id="wp" type="number" value="0"></div></div><label><input id="wph" type="checkbox" '+(holidays[date]?'checked':'')+'> 법정공휴일 근무</label><p class="muted">사업장 규모·근로계약 등에 따라 휴일수당 적용이 달라질 수 있어 금액을 직접 확인·입력하도록 했습니다.</p><button class="btn" onclick="addWork(\''+date+'\')">저장</button> <button onclick="closeM()">닫기</button></div></div>'}function addWork(date){db.work.push({id:Date.now(),date,empId:Number(we.value),hours:Number(wh.value),daily:Number(wd.value),extra:Number(wx.value),holiday:wph.checked,holidayExtra:Number(wp.value)});closeM();save()}function renderHyg(){let rows=db.hyg.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<tr><td>'+x.date+'</td><td>'+x.title+'</td><td>'+x.note+'</td><td><button class="danger" onclick="delH('+x.id+')">삭제</button></td></tr>').join('');document.getElementById('hyg').innerHTML='<div class="card"><h2>위생일지</h2><button class="btn" onclick="openHyg(new Date().toISOString().slice(0,10))">일지 추가</button><table><tr><th>날짜</th><th>항목</th><th>내용</th><th></th></tr>'+rows+'</table></div>'}function openHyg(date){document.getElementById('modal').innerHTML='<div class="modal"><div class="box"><h3>위생일지 추가</h3><div class="field"><label>날짜</label><input id="hd" type="date" value="'+date+'"></div><div class="field"><label>점검항목</label><input id="ht" value="일일 위생점검"></div><div class="field"><label>점검내용/특이사항</label><textarea id="hn" rows="5" placeholder="냉장고 온도, 청소상태, 소비기한 등"></textarea></div><button class="btn" onclick="addH()">저장</button> <button onclick="closeM()">닫기</button></div></div>'}function addH(){db.hyg.push({id:Date.now(),date:hd.value,title:ht.value,note:hn.value});closeM();save()}function delH(id){if(confirm('삭제할까요?')){db.hyg=db.hyg.filter(x=>x.id!==id);save()}}function renderEmp(){let rows=db.employees.map(e=>'<tr><td>'+e.name+'</td><td>'+(e.type==='hourly'?'시급':e.type==='daily'?'일당':'월급')+'</td><td>'+won(e.rate)+'</td><td>'+(e.insurance?'적용':'미적용')+'</td><td><button class="danger" onclick="delE('+e.id+')">삭제</button></td></tr>').join('');document.getElementById('emp').innerHTML='<div class="card"><h2>직원관리</h2><button class="btn" onclick="openEmp()">직원 추가</button><table><tr><th>이름</th><th>급여형태</th><th>기준금액</th><th>4대보험</th><th></th></tr>'+rows+'</table></div>'}function openEmp(){document.getElementById('modal').innerHTML='<div class="modal"><div class="box"><h3>직원 추가</h3><div class="field"><label>이름</label><input id="en"></div><div class="field"><label>급여형태</label><select id="et"><option value="hourly">시급</option><option value="daily">일당</option><option value="monthly">월급</option></select></div><div class="field"><label>시급/일당/월급</label><input id="er" type="number" value="10320"></div><label><input id="ei" type="checkbox" checked> 4대보험 적용</label><div class="field"><label>월 근로소득세(간이세액표 확인값)</label><input id="ex" type="number" value="0"></div><button class="btn" onclick="addE()">저장</button> <button onclick="closeM()">닫기</button></div></div>'}function addE(){db.employees.push({id:Date.now(),name:en.value,type:et.value,rate:Number(er.value),insurance:ei.checked,tax:Number(ex.value)});closeM();save()}function delE(id){if(confirm('직원을 삭제할까요?')){db.employees=db.employees.filter(e=>e.id!==id);save()}}function renderPay(){let rows=db.employees.map(e=>{let g=grossFor(e),d=deductions(e,g),ded=d.p+d.h+d.l+d.u+d.t+d.local,net=g-ded;return '<tr><td>'+e.name+'</td><td>'+won(g)+'</td><td>'+won(d.p)+'</td><td>'+won(d.h)+'</td><td>'+won(d.l)+'</td><td>'+won(d.u)+'</td><td>'+won(d.t)+'</td><td>'+won(d.local)+'</td><td><b>'+won(net)+'</b></td></tr>'}).join('');document.getElementById('pay').innerHTML='<div class="card"><h2>'+monthKey()+' 예상 급여</h2><div style="overflow:auto"><table><tr><th>직원</th><th>세전</th><th>국민연금</th><th>건강보험</th><th>장기요양</th><th>고용보험</th><th>소득세</th><th>지방소득세</th><th>예상 세후</th></tr>'+rows+'</table></div><p class="muted">보험료·세금은 예상치입니다. 실제 급여 확정 전 사업장 적용 여부, 보수월액, 국세청 간이세액표 등을 확인하세요.</p></div>'}function renderSet(){document.getElementById('set').innerHTML='<div class="card"><h2>설정</h2><div class="field"><label>PIN 변경</label><input id="np" value="'+db.pin+'"></div><button class="btn" onclick="db.pin=np.value;save();alert(\'변경됨\')">저장</button><hr><button class="danger" onclick="if(confirm(\'모든 데이터를 초기화할까요?\')){localStorage.removeItem(K);location.reload()}">전체 초기화</button></div>'}function closeM(){document.getElementById('modal').innerHTML=''}render();</script></body></html>
